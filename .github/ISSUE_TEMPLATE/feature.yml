name: Feature proposal
description: Propose a focused capability or integration
title: "proposal: "
labels:
  - proposal
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should Kaxu solve?
    validations:
      required: true
  - type: textarea
    id: operation
    attributes:
      label: Operation model
      description: How should this map to Command, Event, Policy, Adapter, or Projection?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
