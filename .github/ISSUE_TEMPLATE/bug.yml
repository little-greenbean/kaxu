name: Bug report
description: Report a reproducible Kaxu defect
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or credentials here. Follow SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, Agent provider, and relevant versions.
