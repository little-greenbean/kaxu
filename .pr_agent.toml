[config]
# The workflow injects model and fallback_models from Actions Variables. Keep credentials in Actions Secrets.
publish_output = true
propagate_tool_errors = true
repo_context_files = ["AGENTS.md", "current_project.md"]
repo_context_from_default_branch = true
response_language = "zh-CN"
restricted_mode = true

[pr_reviewer]
persistent_comment = true
publish_output_no_suggestions = true

[github_action_config]
auto_review = true
auto_describe = false
auto_improve = false
pr_actions = ["opened", "reopened", "ready_for_review", "synchronize"]
